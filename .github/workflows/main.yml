name: Build Firmware

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  build-firmware:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      # Для сборки ZMK нужен Zephyr SDK.
      # В CI его надо скачать и установить явно.
      - name: Install Zephyr SDK
        run: |
          wget -q https://github.com/zephyrproject-rtos/sdk-ng/releases/download/v0.17.3/zephyr-sdk-0.17.3_linux-x86_64.tar.xz
          sudo tar xf zephyr-sdk-0.17.3_linux-x86_64.tar.xz -C /opt
          sudo /opt/zephyr-sdk-0.17.3/setup.sh -t all -h /opt/zephyr-sdk-0.17.3

      - name: Initialize West
        run: west init -l

      - name: Build firmware
        env:
          ZEPHYR_BASE: /opt/zephyr-sdk-0.17.3/sysroots/x86_64-pokysdk-linux/usr/share/zephyr
          ZEPHYR_SDK_INSTALL_DIR: /opt/zephyr-sdk-0.17.3
        run: west build -b jorne_dongle -- -DCONFIG_ZMK_KEYMAP_PATH=./keymaps/jorne_dongle
