name: Build and Test

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '20'

      - name: Install dependencies
        run: npm ci

      # Дальше идут твои шаги сборки (west build и т.п.)
      - name: Build firmware
        run: west build -b jorne_dongle -- -DCONFIG_ZMK_KEYMAP_PATH=./keymaps/jorne_dongle


