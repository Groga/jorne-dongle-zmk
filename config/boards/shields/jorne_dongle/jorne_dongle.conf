# =============================================================================
# jorne_dongle.conf
#
# Версия: 1.0.0
# Автор:  Evgeniy Moskovkin
#
# Точечные Kconfig-настройки именно для донгла (в дополнение к
# Kconfig.defconfig). Правьте под себя.
# =============================================================================

# Донгл почти всегда воткнут в USB — не уходим в глубокий сон
CONFIG_ZMK_SLEEP=n

# ВКЛ RGB/OLED статус на донгле по желанию (если на плате есть экран/светодиод)
# CONFIG_ZMK_RGB_UNDERGLOW=n

# Полезно для отладки первой сборки — потом можно выключить (n)
CONFIG_ZMK_USB_LOGGING=y
