# =============================================================================
# build.yaml — матрица сборки для GitHub Actions (zmk build user config action)
#
# Версия: 1.0.0
# Автор:  Evgeniy Moskovkin
#
# Схема:
#   - jorne_dongle  -> центральное устройство (само в USB/сидит "донглом"),
#                      принимает обе половинки как BLE-периферию.
#   - jorne_left    -> левая половинка, ПЕРИФЕРИЯ (не центр, как в обычной
#                      схеме "левая половинка = центр")
#   - jorne_right   -> правая половинка, ПЕРИФЕРИЯ
#
# Плата: замените "nice_nano_v2" на вашу реальную плату nRF52840
#   (nice_nano_v2, nrfmicro_13, seeeduino_xiao_ble, supermini_nrf52840 и т.п.)
#   ВАЖНО: и половинки, и донгл должны быть указаны с board соответствующей
#   именно вашему физическому чипу ProMicro-nRF52840.
# =============================================================================
---
include:
  - board: nice_nano_v2
    shield: jorne_dongle
    artifact-name: jorne_dongle
  - board: nice_nano_v2
    shield: jorne_left
    cmake-args: -DCONFIG_ZMK_SPLIT_ROLE_CENTRAL=n
    artifact-name: jorne_left_peripheral
  - board: nice_nano_v2
    shield: jorne_right
    artifact-name: jorne_right_peripheral
  - board: nice_nano_v2
    shield: settings_reset
    artifact-name: settings_reset
